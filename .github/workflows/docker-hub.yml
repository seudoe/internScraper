# Builds the Dockerfile (linux/amd64, what Zoho Catalyst AppSail runs) and pushes it to Docker Hub.
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token with read/write).
name: docker-hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ifind-scraper:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ifind-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
