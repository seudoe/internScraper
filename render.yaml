# Render Blueprint — New + → Blueprint → select this repo.
services:
  - type: web
    name: ifind-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # Chrome + scam_detector (pandas/sklearn) need ~2 GB; free/starter (512 MB) will OOM
    region: singapore         # pick the region closest to your MongoDB Atlas cluster
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false           # set in dashboard
      - key: COHERE_API_KEY
        sync: false
      - key: VECTORISER_URL
        sync: false           # base URL of the vectorizer service
      - key: FIRST_PARTY_DOMAINS
        sync: false           # iFind's own domains, comma-separated (used by POST /process)
      - key: INTERNSCRAPER_API_KEY
        sync: false           # optional shared secret for POST /process (x-api-key header)
      - key: MAIN_URL
        sync: false           # main project origin(s), comma-separated (add http://localhost:3000 for dev)
      - key: TELEGRAM_BOT_TOKEN
        sync: false           # from @BotFather
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false           # random string; Telegram sends it back in a header
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false           # comma-separated Telegram user ids allowed to submit
